min_version = '2026.9.7'
monorepo_root = true

[monorepo]
config_roots = []
lockfile = false

# Component tasks are discovered by `one init mise`. Product tasks deliberately
# delegate to Taskfile.yml so bootstrap, profiles and packaging checks stay shared.
[tasks]
[tasks.'verify:one']
description = 'Validate One task plans and mise synchronization without executing workflows'
run = 'node packages/tooling/src/one/verify.ts'

[tasks.'browser-extension:build']
depends = ['//:common:build']
dir = 'packages/browser-extension'
raw_args = true
run = 'pnpm run build'

[tasks.'browser-extension:dev']
depends = ['//:common:build']
dir = 'packages/browser-extension'
raw_args = true
run = 'pnpm run dev'

[tasks.'browser-extension:lint']
dir = 'packages/browser-extension'
raw_args = true
run = 'pnpm run lint'

[tasks.'browser-extension:test:public-types']
dir = 'packages/browser-extension'
raw_args = true
run = 'pnpm run test:public-types'

[tasks.'browser-extension:type:check']
dir = 'packages/browser-extension'
raw_args = true
run = 'pnpm run type:check'

[tasks.build]
description = "Build the Electron application and its workspace dependencies"
run = "task build:electron"
depends = []

[tasks.'common:build']
dir = 'packages/common'
raw_args = true
run = 'pnpm run build'

