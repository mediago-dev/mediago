name: Validate MediaGo

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "10.15.0"
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "10.15.0"
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ts

  test-go:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          cache-dependency-path: apps/core/go.sum
      - run: go test ./...
        working-directory: apps/core

  pr-gate:
    name: PR gate
    if: ${{ always() }}
    needs: [quality, test-ts, test-go]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      TYPESCRIPT_RESULT: ${{ needs.test-ts.result }}
      GO_RESULT: ${{ needs.test-go.result }}
    steps:
      - run: |
          failed=0
          for result in \
            "quality:$QUALITY_RESULT" \
            "test-ts:$TYPESCRIPT_RESULT" \
            "test-go:$GO_RESULT"
          do
            job="${result%%:*}"
            status="${result#*:}"
            if [ "$status" != "success" ]; then
              echo "$job result: $status"
              failed=1
            fi
          done
          exit "$failed"
