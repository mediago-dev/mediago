name: Validate MediaGo

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
        with:
          version: "3.51.1"
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: pnpm
      - run: task ci:quality
      - run: pnpm security:js

  test-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
        with:
          version: "3.51.1"
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: pnpm
      - run: task ci:test:ts

  test-go:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
        with:
          version: "3.51.1"
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/core/go.mod
          cache-dependency-path: apps/core/go.sum
      - run: task ci:test:go
      - name: Install official Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check affected backend function calls
        working-directory: apps/core
        run: govulncheck ./...
        env:
          CGO_ENABLED: "0"

  test-media-integration:
    name: Test local media integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
        with:
          version: "3.51.1"
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/core/go.mod
          cache-dependency-path: apps/core/go.sum
      - name: Cache media integration dependencies
        uses: actions/cache@v6
        with:
          path: .deps
          key: media-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/tooling/manifests/runtime-deps.json') }}
      - name: Run media integration tests
        run: task ci:test:media
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test-e2e:
    name: Test Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        project: [web, electron, extension]
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
        with:
          version: "3.51.1"
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/core/go.mod
          cache-dependency-path: apps/core/go.sum
      - name: Cache E2E dependencies
        uses: actions/cache@v6
        with:
          path: .deps
          key: e2e-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/tooling/manifests/runtime-deps.json') }}-${{ hashFiles('packages/tooling/src/runtime-deps/download.ts', 'packages/tooling/src/runtime-deps/args.ts', 'packages/tooling/src/runtime-deps/integrity.ts') }}
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Run Playwright project
        run: task ci:test:e2e
        env:
          MEDIAGO_E2E_PROJECT: ${{ matrix.project }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 3

  pr-gate:
    name: PR gate
    if: ${{ always() }}
    needs: [quality, test-ts, test-go, test-media-integration, test-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      TYPESCRIPT_RESULT: ${{ needs.test-ts.result }}
      GO_RESULT: ${{ needs.test-go.result }}
      MEDIA_INTEGRATION_RESULT: ${{ needs.test-media-integration.result }}
      E2E_RESULT: ${{ needs.test-e2e.result }}
    steps:
      - run: |
          failed=0
          for result in \
            "quality:$QUALITY_RESULT" \
            "test-ts:$TYPESCRIPT_RESULT" \
            "test-go:$GO_RESULT" \
            "media-integration:$MEDIA_INTEGRATION_RESULT" \
            "test-e2e:$E2E_RESULT"
          do
            job="${result%%:*}"
            status="${result#*:}"
            if [ "$status" != "success" ]; then
              echo "$job result: $status"
              failed=1
            fi
          done
          exit "$failed"
