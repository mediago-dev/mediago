name: Deploy test media

on:
  push:
    branches: ["master"]
    paths:
      - "tests/media-service/public/v1/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test-media
  cancel-in-progress: false

env:
  BUCKET: downloader-docs
  ENDPOINT: oss-cn-beijing.aliyuncs.com
  ACCESS_KEY: LTAI5tDrRjFUAvufpCJioz3b
  OSSUTIL_SHA256: 398b1607bce96dd12b2bf4f5c5ebf727550c4732c4564347eb598431f7fdf3e9
  MEDIA_VERSION: v1
  MEDIA_BASE_URL: https://downloader.caorushizi.cn/test-media/v1

jobs:
  deploy:
    name: Publish test media
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: "10.15.0"
          run_install: false
          standalone: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Alibaba Cloud ossutil
        run: |
          set -euo pipefail
          wget --quiet https://gosspublic.alicdn.com/ossutil/1.6.10/ossutil64
          printf '%s  %s\n' "$OSSUTIL_SHA256" ossutil64 | sha256sum -c -
          chmod +x ossutil64

      - name: Configure Alibaba Cloud ossutil
        run: ./ossutil64 config -i "$ACCESS_KEY" -k "$ACCESS_KEY_SECRET" -e "$ENDPOINT" -c "$RUNNER_TEMP/.ossutilconfig"
        env:
          ACCESS_KEY_SECRET: ${{ secrets.ACCESS_KEY_SECRET }}

      - name: Publish immutable test media
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/tests/media-service/public/$MEDIA_VERSION"
          target_prefix="oss://${BUCKET}/test-media/$MEDIA_VERSION"
          local_manifest="$source_dir/manifest.json"
          remote_manifest="$target_prefix/manifest.json"
          remote_manifest_file="$RUNNER_TEMP/test-media-remote-manifest.json"
          stat_log="$RUNNER_TEMP/test-media-manifest-stat.log"

          if ./ossutil64 --config-file "$RUNNER_TEMP/.ossutilconfig" stat "$remote_manifest" > "$stat_log" 2>&1; then
            ./ossutil64 --config-file "$RUNNER_TEMP/.ossutilconfig" cp "$remote_manifest" "$remote_manifest_file" -f
            if ! cmp -s "$local_manifest" "$remote_manifest_file"; then
              echo "::error::Remote $MEDIA_VERSION manifest differs from the committed manifest"
              exit 1
            fi
            echo "Remote $MEDIA_VERSION manifest matches; repairing objects idempotently"
          elif grep -q "ErrorCode=NoSuchKey" "$stat_log"; then
            echo "Remote $MEDIA_VERSION manifest does not exist; creating the version"
          else
            echo "::error::Unable to determine whether the remote $MEDIA_VERSION manifest exists"
            exit 1
          fi

          media_paths=(
            "sample.mp4"
            "hls/index.m3u8"
            "hls/init.mp4"
            "hls/segment-0.m4s"
          )
          for media_path in "${media_paths[@]}"; do
            ./ossutil64 --config-file "$RUNNER_TEMP/.ossutilconfig" cp "$source_dir/$media_path" "$target_prefix/$media_path" -f
          done
          ./ossutil64 --config-file "$RUNNER_TEMP/.ossutilconfig" cp "$local_manifest" "$remote_manifest" -f

      - name: Verify published media
        run: pnpm exec tsx tests/media-service/verify.ts "$MEDIA_BASE_URL"

      - name: Verify published Range response
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/test-media-range-headers.txt"
          body="$RUNNER_TEMP/test-media-range-body.bin"
          status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 2 --header "Range: bytes=0-15" --dump-header "$headers" --output "$body" --write-out "%{http_code}" "$MEDIA_BASE_URL/sample.mp4")"

          if [ "$status" != "206" ]; then
            echo "::error::Range request returned HTTP $status instead of 206"
            exit 1
          fi
          if ! tr -d '\r' < "$headers" | grep -Eiq '^content-range:[[:space:]]*bytes 0-15/[0-9]+$'; then
            echo "::error::Range response has an invalid Content-Range header"
            exit 1
          fi
          if [ "$(wc -c < "$body")" -ne 16 ]; then
            echo "::error::Range response body is not 16 bytes"
            exit 1
          fi
