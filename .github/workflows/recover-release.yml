name: Recover existing beta release
run-name: Recover beta release from run ${{ inputs.original_run_id }}
on:
  workflow_dispatch:
    inputs:
      original_run_id:
        description: "Failed all-platform release run to recover"
        required: true
        type: string
      source_sha:
        description: "Exact version commit owned by that run"
        required: true
        type: string
permissions: {}
concurrency:
  group: mediago-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.recovery.outputs.version }}
      tag: ${{ steps.recovery.outputs.tag }}
      source_sha: ${{ steps.recovery.outputs.source_sha }}
      tooling_sha: ${{ steps.recovery.outputs.tooling_sha }}
      artifact_prefix: ${{ steps.recovery.outputs.artifact_prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: go-task/setup-task@v2
        with:
          version: "3.51.1"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
      - name: Validate original release and unchanged product source
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: task ci:release:prepare-recovery
  intel:
    needs: prepare
    runs-on: macos-15-intel
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tooling_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: go-task/setup-task@v2
        with:
          version: "3.51.1"
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: "pnpm"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/core/go.mod
          cache-dependency-path: apps/core/go.sum
      - name: Restore exact product source and apply reviewed packaging tooling
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          TOOLING_SHA: ${{ needs.prepare.outputs.tooling_sha }}
        run: task ci:release:apply-recovery-tooling
      - name: Build, notarize and validate Intel Mac
        run: task ci:desktop:release
        env:
          APP_TD_APPID: ${{ secrets.APP_TD_APPID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-macos-15-intel
          path: |
            apps/electron/release/*.dmg
            apps/electron/release/*.zip
            apps/electron/release/*.blockmap
            apps/electron/release/*.yml
            !apps/electron/release/builder-*.yml
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  publish:
    needs: [prepare, intel]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tooling_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: go-task/setup-task@v2
        with:
          version: "3.51.1"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
      - name: Reuse successful original platform artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.original_run_id }}
          pattern: ${{ needs.prepare.outputs.artifact_prefix }}-*
          path: electron-artifacts
      - name: Download recovered Intel Mac artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.prepare.outputs.artifact_prefix }}-macos-15-intel
          path: electron-artifacts
      - name: Collect and validate the full release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          UPDATER_CHANNEL: beta
        run: task ci:release:collect-electron-artifacts
      - name: Publish the original version and product commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_MODE: release
          RELEASE_CHANNEL: beta
          VERSION: ${{ needs.prepare.outputs.version }}
          OFFICIAL_TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SERVER_URL: ${{ github.server_url }}
        run: task ci:release:publish-desktop
