version: "3"

vars:
  REQUIRED_TASK_VERSION: 3.51.1
  MEDIAGO_DEPS_ROOT: '{{default (printf "%s/.deps" .ROOT_DIR) .MEDIAGO_DEPS_ROOT}}'

tasks:
  doctor:
    desc: Diagnose the local MediaGo toolchain and runtime dependencies; Node >=24.14.0 is required to aggregate checks
    preconditions:
      - sh: >-
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); process.exit(major > 24 || (major === 24 && minor >= 14) ? 0 : 1)"
        msg: Node 24.14.0 or newer is MediaGo's bootstrap prerequisite. Without a usable Node runtime, doctor cannot aggregate the remaining diagnostics. Install or switch Node (for example, mise use node@24.14.0), then retry.
    env:
      MEDIAGO_TASK_VERSION: "{{.TASK_VERSION}}"
      MEDIAGO_REQUIRED_TASK_VERSION: "{{.REQUIRED_TASK_VERSION}}"
      MEDIAGO_DEPS_ROOT: "{{.MEDIAGO_DEPS_ROOT}}"
    cmds:
      - node scripts/task-doctor.ts

  setup:
    desc: Install Node and current-platform runtime dependencies
    cmds:
      - task: internal:require-task-version
      - task: internal:setup

  deps:node:
    desc: Install the pinned pnpm workspace dependencies
    cmds:
      - task: internal:require-task-version
      - task: internal:deps:node

  deps:runtime:
    desc: Install all current-platform runtime tools
    cmds:
      - task: internal:require-task-version
      - task: internal:deps:runtime

  deps:media-integration:
    desc: Install tools used by media integration tests
    cmds:
      - task: internal:require-task-version
      - task: internal:deps:media-integration

  deps:e2e:
    desc: Install tools used by end-to-end tests
    cmds:
      - task: internal:require-task-version
      - task: internal:deps:e2e

  dev:all:
    desc: Start every MediaGo development surface
    cmds:
      - task: internal:require-task-version
      - task: internal:dev:all

  dev:web:
    desc: Start the server adapter and web UI
    cmds:
      - task: internal:require-task-version
      - task: internal:dev:web

  dev:server:
    desc: Alias for dev:web
    cmds:
      - task: internal:require-task-version
      - task: internal:dev:web

  dev:electron:
    desc: Start the Electron desktop application
    cmds:
      - task: internal:require-task-version
      - task: internal:dev:electron

  dev:extension:
    desc: Start the browser extension development server
    cmds:
      - task: internal:require-task-version
      - task: internal:dev:extension

  docs:dev:
    desc: Start the documentation development server
    cmds:
      - task: internal:require-task-version
      - task: internal:docs:dev

  check:
    desc: Run lint, formatting, and type checks
    cmds:
      - task: internal:require-task-version
      - task: internal:check

  test:
    desc: Run the TypeScript and Go test suites
    cmds:
      - task: internal:require-task-version
      - task: internal:test

  test:ts:
    desc: Run the TypeScript test suite
    cmds:
      - task: internal:require-task-version
      - task: internal:test:ts

  test:go:
    desc: Run the Go test suite
    cmds:
      - task: internal:require-task-version
      - task: internal:test:go

  test:integration:
    desc: Run media integration tests
    cmds:
      - task: internal:require-task-version
      - task: internal:test:integration

  test:e2e:
    desc: Run all Playwright end-to-end projects
    cmds:
      - task: internal:require-task-version
      - task: internal:test:e2e

  test:e2e:web:
    desc: Run the Playwright web project
    cmds:
      - task: internal:require-task-version
      - task: internal:test:e2e:web

  test:e2e:electron:
    desc: Run the Playwright Electron project
    cmds:
      - task: internal:require-task-version
      - task: internal:test:e2e:electron

  test:e2e:extension:
    desc: Run the Playwright extension project
    cmds:
      - task: internal:require-task-version
      - task: internal:test:e2e:extension

  build:web:
    desc: Build the web UI
    cmds:
      - task: internal:require-task-version
      - task: internal:build:web

  build:server:
    desc: Build the server adapter and web UI
    cmds:
      - task: internal:require-task-version
      - task: internal:build:server

  build:electron:
    desc: Build the Electron desktop application
    cmds:
      - task: internal:require-task-version
      - task: internal:production:build:electron

  build:extension:
    desc: Build the browser extension
    cmds:
      - task: internal:require-task-version
      - task: internal:build:extension

  build:docs:
    desc: Build the documentation site
    cmds:
      - task: internal:require-task-version
      - task: internal:build:docs

  build:docker:
    desc: Build the local MediaGo Docker image
    cmds:
      - task: internal:require-task-version
      - task: internal:build:docker

  pack:extension:
    desc: Build and package the browser extension
    cmds:
      - task: internal:require-task-version
      - task: internal:pack:extension

  pack:electron:
    desc: Package the Electron desktop application
    cmds:
      - task: internal:require-task-version
      - task: internal:production:pack:electron

  release:electron:
    desc: Build Electron release artifacts
    cmds:
      - task: internal:require-task-version
      - task: internal:production:release:electron

  ci:quality:
    desc: Run the pull-request quality checks
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:quality

  ci:test:ts:
    desc: Run the pull-request TypeScript tests
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:test:ts

  ci:test:go:
    desc: Run the pull-request Go tests
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:test:go

  ci:test:media:
    desc: Run the pull-request media integration tests
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:test:media

  ci:test:e2e:
    desc: Run the pull-request Playwright end-to-end tests
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:test:e2e

  ci:docs:build:
    desc: Build documentation for continuous integration
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:docs:build

  ci:desktop:validate-request:
    desc: Validate the desktop workflow request
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:desktop:validate-request

  ci:desktop:verify-source:
    desc: Verify the desktop workflow source and version
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:desktop:verify-source

  ci:desktop:artifact-prefix:
    desc: Resolve the desktop workflow artifact prefix
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:desktop:artifact-prefix

  ci:desktop:apply-version:
    desc: Apply the desktop workflow build version
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:desktop:apply-version

  ci:desktop:release:
    desc: Build desktop workflow release artifacts
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:desktop:release

  ci:docker:validate-inputs:
    desc: Validate the Docker workflow inputs
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:docker:validate-inputs

  ci:docker:resolve-parameters:
    desc: Resolve the Docker workflow build parameters
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:docker:resolve-parameters

  ci:docker:verify-preview-private:
    desc: Verify that the Docker preview package is private
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:docker:verify-preview-private

  ci:docker:detect-dockerhub:
    desc: Detect Docker Hub credentials for the Docker workflow
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:docker:detect-dockerhub

  ci:docker:resolve-targets:
    desc: Resolve the Docker workflow image targets
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:docker:resolve-targets

  ci:docker:write-summary:
    desc: Write the Docker workflow summary
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:docker:write-summary

  ci:release:validate-request:
    desc: Validate the release workflow request
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:release:validate-request

  ci:release:detect-release-state:
    desc: Detect the current GitHub Release state
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:release:detect-release-state

  ci:release:calculate-version:
    desc: Calculate the release workflow version
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:release:calculate-version

  ci:release:commit-version:
    desc: Commit the official release version
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:release:commit-version

  ci:release:resolve-source:
    desc: Resolve the release workflow build source
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:release:resolve-source

  ci:release:write-prepare-summary:
    desc: Write the release preparation summary
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:release:write-prepare-summary

  ci:release:collect-electron-artifacts:
    desc: Collect and validate Electron release artifacts
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:release:collect-electron-artifacts

  ci:release:publish-desktop:
    desc: Publish the desktop GitHub Release
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:release:publish-desktop

  ci:release:write-desktop-summary:
    desc: Write the desktop release summary
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:release:write-desktop-summary

  ci:release:tag-docker-release:
    desc: Tag a Docker-only release
    cmds:
      - task: internal:require-task-version
      - task: internal:ci:release:tag-docker-release

  internal:require-task-version:
    internal: true
    preconditions:
      - sh: >-
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); process.exit(major > 22 || (major === 22 && minor >= 18) ? 0 : 1)"
        msg: Node 22.18.0 or newer is required to validate the pinned Task version. Install or switch Node, then retry.
    env:
      MEDIAGO_TASK_VERSION: "{{.TASK_VERSION}}"
      MEDIAGO_REQUIRED_TASK_VERSION: "{{.REQUIRED_TASK_VERSION}}"
    cmds:
      - node scripts/task-version-gate.ts

  internal:setup:
    internal: true
    vars: &development-profile-vars
      MEDIAGO_PROFILE: '{{default "development" .MEDIAGO_PROFILE}}'
    env: &profile-env
      MEDIAGO_PROFILE: "{{.MEDIAGO_PROFILE}}"
    dotenv: &profile-dotenv
      - ".env.{{.MEDIAGO_PROFILE}}.local"
      - ".env.local"
      - ".env.{{.MEDIAGO_PROFILE}}"
      - ".env"
    requires: &profile-requires
      vars:
        - name: MEDIAGO_PROFILE
          enum: [development, test, production]
    deps:
      - task: internal:deps:node
      - task: internal:deps:runtime

  internal:deps:node:
    internal: true
    run: once
    preconditions:
      - sh: >-
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); process.exit(major > 24 || (major === 24 && minor >= 14) ? 0 : 1)"
        msg: Node 24.14.0 or newer is required to install MediaGo's workspace dependencies. Install or switch Node (for example, mise use node@24.14.0), then retry.
    method: timestamp
    sources:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - docs/package.json
      - apps/*/package.json
      - apps/*/app/package.json
      - packages/*/package.json
      - packages/*/*/package.json
    generates:
      - node_modules/.pnpm/lock.yaml
    cmds:
      - pnpm install --frozen-lockfile

  internal:deps:runtime:
    internal: true
    run: once
    vars: &runtime-vars
      MEDIAGO_PLATFORM_KEY:
        sh: node scripts/print-platform-key.ts
    env: &runtime-env
      MEDIAGO_DEPS_ROOT: "{{.MEDIAGO_DEPS_ROOT}}"
      MEDIAGO_DEPS_DIR: "{{.MEDIAGO_DEPS_ROOT}}/{{.MEDIAGO_PLATFORM_KEY}}"
    deps:
      - task: internal:deps:node
    cmds:
      - pnpm deps:download:raw --tools ffmpeg,N_m3u8DL-RE,BBDown,aria2,yt-dlp,mediago
      - 'node -e "console.log(''MEDIAGO_RUNTIME_READY'', process.env.MEDIAGO_DEPS_DIR)"'

  internal:deps:media-integration:
    internal: true
    vars: &test-runtime-vars
      MEDIAGO_PROFILE: '{{default "test" .MEDIAGO_PROFILE}}'
      MEDIAGO_PLATFORM_KEY:
        sh: node scripts/print-platform-key.ts
    env:
      MEDIAGO_PROFILE: "{{.MEDIAGO_PROFILE}}"
      MEDIAGO_DEPS_ROOT: "{{.MEDIAGO_DEPS_ROOT}}"
      MEDIAGO_DEPS_DIR: "{{.MEDIAGO_DEPS_ROOT}}/{{.MEDIAGO_PLATFORM_KEY}}"
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
    cmds:
      - pnpm deps:download:raw --tools aria2,N_m3u8DL-RE,ffmpeg,BBDown
      - 'node -e "console.log(''MEDIAGO_RUNTIME_READY'', process.env.MEDIAGO_DEPS_DIR)"'

  internal:deps:e2e:
    internal: true
    vars: *test-runtime-vars
    env:
      MEDIAGO_PROFILE: "{{.MEDIAGO_PROFILE}}"
      MEDIAGO_DEPS_ROOT: "{{.MEDIAGO_DEPS_ROOT}}"
      MEDIAGO_DEPS_DIR: "{{.MEDIAGO_DEPS_ROOT}}/{{.MEDIAGO_PLATFORM_KEY}}"
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
    cmds:
      - pnpm deps:download:raw --tools aria2
      - 'node -e "console.log(''MEDIAGO_RUNTIME_READY'', process.env.MEDIAGO_DEPS_DIR)"'

  internal:dev:all:
    internal: true
    vars: &development-runtime-vars
      MEDIAGO_PROFILE: '{{default "development" .MEDIAGO_PROFILE}}'
      MEDIAGO_PLATFORM_KEY:
        sh: node scripts/print-platform-key.ts
    env: &development-runtime-env
      MEDIAGO_PROFILE: "{{.MEDIAGO_PROFILE}}"
      MEDIAGO_DEPS_ROOT: "{{.MEDIAGO_DEPS_ROOT}}"
      MEDIAGO_DEPS_DIR: "{{.MEDIAGO_DEPS_ROOT}}/{{.MEDIAGO_PLATFORM_KEY}}"
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
      - task: internal:deps:runtime
      - task: internal:core:build
      - task: internal:build:electron
    cmds:
      - 'node -e "console.log(''MEDIAGO_DEV_PROCESSES_STARTING'')"'
      - pnpm dev:all:raw

  internal:dev:web:
    internal: true
    vars: *development-runtime-vars
    env: *development-runtime-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
      - task: internal:deps:runtime
      - task: internal:core:build
    cmds:
      - pnpm dev:web:raw

  internal:dev:electron:
    internal: true
    vars: *development-runtime-vars
    env: *development-runtime-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
      - task: internal:deps:runtime
      - task: internal:core:build
      - task: internal:build:electron
    cmds:
      - pnpm start:electron

  internal:dev:extension:
    internal: true
    vars: *development-profile-vars
    env: *profile-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
    cmds:
      - pnpm -F @mediago/extension run dev

  internal:docs:dev:
    internal: true
    vars: *development-profile-vars
    env: *profile-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
    cmds:
      - pnpm -F @mediago/docs run docs:dev

  internal:check:
    internal: true
    vars: &test-profile-vars
      MEDIAGO_PROFILE: '{{default "test" .MEDIAGO_PROFILE}}'
    env: *profile-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
    cmds:
      - pnpm lint
      - pnpm format:check
      - pnpm type:check

  internal:test:
    internal: true
    vars: *test-profile-vars
    env: *profile-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
      - task: internal:test:ts
      - task: internal:test:go

  internal:test:ts:
    internal: true
    vars: *test-profile-vars
    env: *profile-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
    cmds:
      - pnpm exec vitest run

  internal:test:go:
    internal: true
    vars: *test-profile-vars
    env: *profile-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    dir: apps/core
    cmds:
      - go test ./...

  internal:test:integration:
    internal: true
    vars: *test-runtime-vars
    env:
      MEDIAGO_PROFILE: "{{.MEDIAGO_PROFILE}}"
      MEDIAGO_DEPS_ROOT: "{{.MEDIAGO_DEPS_ROOT}}"
      MEDIAGO_DEPS_DIR: "{{.MEDIAGO_DEPS_ROOT}}/{{.MEDIAGO_PLATFORM_KEY}}"
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:media-integration
    cmds:
      - pnpm test:integration:media:run:raw

  internal:test:e2e:
    internal: true
    vars: *test-runtime-vars
    env: &test-runtime-env
      MEDIAGO_PROFILE: "{{.MEDIAGO_PROFILE}}"
      MEDIAGO_DEPS_ROOT: "{{.MEDIAGO_DEPS_ROOT}}"
      MEDIAGO_DEPS_DIR: "{{.MEDIAGO_DEPS_ROOT}}/{{.MEDIAGO_PLATFORM_KEY}}"
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps: &e2e-deps
      - task: internal:deps:e2e
      - task: internal:core:build
      - task: internal:test:e2e:build
      - task: internal:test:e2e:chromium
    cmds:
      - pnpm test:e2e:raw

  internal:test:e2e:web:
    internal: true
    vars: *test-runtime-vars
    env: *test-runtime-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps: *e2e-deps
    cmds:
      - pnpm test:e2e:web:raw

  internal:test:e2e:electron:
    internal: true
    vars: *test-runtime-vars
    env: *test-runtime-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps: *e2e-deps
    cmds:
      - pnpm test:e2e:electron:raw

  internal:test:e2e:extension:
    internal: true
    vars: *test-runtime-vars
    env: *test-runtime-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps: *e2e-deps
    cmds:
      - pnpm test:e2e:extension:raw

  internal:core:build:
    internal: true
    run: once
    deps:
      - task: internal:deps:node
    cmds:
      - pnpm core:build

  internal:test:e2e:build:
    internal: true
    vars: *test-profile-vars
    env: *profile-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
    cmds:
      - pnpm test:e2e:build:raw

  internal:test:e2e:chromium:
    internal: true
    deps:
      - task: internal:deps:node
    cmds:
      - pnpm exec playwright install chromium

  internal:build:web:
    internal: true
    vars: &production-profile-vars
      MEDIAGO_PROFILE: '{{default "production" .MEDIAGO_PROFILE}}'
    env: *profile-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
    cmds:
      - pnpm build:web:raw

  internal:build:server:
    internal: true
    vars: *production-profile-vars
    env: *profile-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
      - task: internal:core:build
    cmds:
      - pnpm build:server:raw

  internal:build:electron:
    internal: true
    vars: *production-profile-vars
    env: *profile-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
      - task: internal:core:build
    cmds:
      - pnpm build:electron:raw

  internal:production:build:electron:
    internal: true
    deps: &production-metadata-bootstrap-deps
      - task: internal:deps:node
    cmds:
      - task: internal:production:build:electron:validated

  internal:production:build:electron:validated:
    internal: true
    vars:
      MEDIAGO_PROFILE: '{{default "production" .MEDIAGO_PROFILE}}'
      APP_NAME:
        sh: node scripts/task-production-metadata.ts APP_NAME
    env: *profile-env
    dotenv: *profile-dotenv
    requires:
      vars:
        - name: MEDIAGO_PROFILE
          enum: [development, test, production]
        - name: APP_NAME
          enum: [present]
    cmds:
      - task: internal:build:electron

  internal:build:extension:
    internal: true
    vars: *production-profile-vars
    env: *profile-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
    cmds:
      - pnpm -F @mediago/extension run build

  internal:build:docs:
    internal: true
    vars: *production-profile-vars
    env: *profile-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:deps:node
    cmds:
      - pnpm -F @mediago/docs run docs:build

  internal:build:docker:
    internal: true
    vars: *production-profile-vars
    env: *profile-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:docker:daemon
    cmds:
      - docker build -t mediago:local .

  internal:docker:daemon:
    internal: true
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: Docker daemon is unavailable. Start Docker and retry task build:docker.

  internal:pack:extension:
    internal: true
    vars: *production-profile-vars
    env: *profile-env
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps:
      - task: internal:build:extension
    cmds:
      - pnpm exec tsx scripts/pack-extension.ts

  internal:pack:electron:
    internal: true
    vars: &production-runtime-vars
      MEDIAGO_PROFILE: '{{default "production" .MEDIAGO_PROFILE}}'
      MEDIAGO_PLATFORM_KEY:
        sh: node scripts/print-platform-key.ts
    env: &production-runtime-env
      MEDIAGO_PROFILE: "{{.MEDIAGO_PROFILE}}"
      MEDIAGO_DEPS_ROOT: "{{.MEDIAGO_DEPS_ROOT}}"
      MEDIAGO_DEPS_DIR: "{{.MEDIAGO_DEPS_ROOT}}/{{.MEDIAGO_PLATFORM_KEY}}"
    dotenv: *profile-dotenv
    requires: *profile-requires
    deps: &electron-package-deps
      - task: internal:deps:runtime
      - task: internal:core:build
      - task: internal:build:electron
    cmds:
      - pnpm -F @mediago/electron run pack

  internal:production:pack:electron:
    internal: true
    deps: *production-metadata-bootstrap-deps
    cmds:
      - task: internal:production:pack:electron:validated

  internal:production:pack:electron:validated:
    internal: true
    vars: &production-package-metadata-vars
      MEDIAGO_PROFILE: '{{default "production" .MEDIAGO_PROFILE}}'
      APP_NAME:
        sh: node scripts/task-production-metadata.ts APP_NAME
      APP_ID:
        sh: node scripts/task-production-metadata.ts APP_ID
      APP_COPYRIGHT:
